[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cortext-memory"
version = "0.5.0"
description = "Low-latency graph memory for AI agents — indexed W5H graph, SQLite, hooks/MCP for Claude Code, Cursor and Copilot, live dashboard"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jhony Miler", email = "jonatasmiler@gmail.com" }]
requires-python = ">=3.10"
keywords = ["memory", "agents", "llm", "ai", "rag", "mcp", "claude-code", "cursor", "copilot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
]
ollama = []  # uses httpx if needed
openai = []  # user provides their own client
embeddings = [
    "sentence-transformers>=2.2",  # optional, for embedding-level contradiction checks
]
all = [
    "sentence-transformers>=2.2",
]

[project.urls]
Homepage = "https://github.com/jhonymiler/Cortex"
Repository = "https://github.com/jhonymiler/Cortex"
Issues = "https://github.com/jhonymiler/Cortex/issues"

[project.scripts]
cortext-memory = "cortext.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cortext*"]

[tool.setuptools.package-data]
"cortext.hermes_plugin" = ["plugin.yaml"]
"cortext.server" = ["static/*.html"]
"cortext.agents" = [
    "claude_mod/.claude-plugin/*.json",
    "claude_mod/hooks/*.json",
    "claude_mod/hooks/*.tsx",
    "claude_mod/types/*.d.ts",
]

[tool.pytest.ini_options]
testpaths = ["tests", "integrations/hermes/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 130
extend-exclude = ["browser-outputs"]

[tool.ruff.lint]
# Pin the classic rule set: newer ruff releases widen the defaults, which made
# `ruff check .` in CI depend on whichever ruff version pip happened to install.
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008", "B905"]

[tool.ruff.lint.per-file-ignores]
# Lazy exports: the TYPE_CHECKING imports exist for static analyzers only.
"cortext/__init__.py" = ["F401"]
